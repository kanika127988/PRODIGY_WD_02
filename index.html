<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonStopwatch - Prodigy WD_02</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Stopwatch <span>App</span></h1>
        <p class="subtitle">Prodigy InfoTech Web Development Task 2</p>

        <!-- Stopwatch Display -->
        <div class="stopwatch-card">
            <div id="display" class="time-display">00:00:00</div>
            
            <!-- Control Buttons -->
            <div class="buttons">
                <button id="startStopBtn" class="btn start-btn"><i class="fa-solid fa-play"></i> Start</button>
                <button id="lapBtn" class="btn lap-btn" disabled><i class="fa-solid fa-flag"></i> Lap</button>
                <button id="resetBtn" class="btn reset-btn"><i class="fa-solid fa-rotate-right"></i> Reset</button>
            </div>
        </div>

        <!-- Laps Section -->
        <div class="laps-container">
            <h3>Lap Times</h3>
            <ul id="lapsList">
                <li class="no-laps">No laps recorded yet</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
